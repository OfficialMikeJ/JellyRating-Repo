name: "Parental Rating Manager"
guid: "77304605-bb68-4844-8aed-251df4e20e83"
version: "1.0.0.0"
targetAbi: "12.1.0"
framework: "net10.0"
overview: "Manage Canadian and US parental ratings and per-user maximum content levels."
description: "Manually assign Canadian or US parental ratings to movies, documentaries, TV series and TV seasons (with automatic inheritance), then enforce per-user maximum content levels through Jellyfin's built-in server-side parental-control engine."
category: "General"
owner: "YourName"
artifacts:
  - "Jellyfin.Plugin.ParentalRatingManager.dll"
changelog: |
  Initial release.
  - Manual US/Canadian parental rating assignment for movies, documentaries, series and seasons
  - Series -> season -> episode rating inheritance (no per-episode management)
  - Per-user maximum permitted content level with unrated-content policy
  - Server-side enforcement via Jellyfin's native parental rating engine
  - Admin dashboard page with library browser, search, filters and bulk rating
